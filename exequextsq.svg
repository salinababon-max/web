<div class="exe-text-template">
    <p>En esta situación de aprendizaje se aplicarán dos metodologías activas:</p>
<p><strong>Aprendizaje-servicio</strong>: uno de los objetivos de este proyecto es informar a la población sobre el eclipse solar que ocurrirá el 12 de agosto y de cómo protegerse de él. Nuestro colegio se encuentra en una zona reprimida por lo que valoramos como una necesidad el informar de dicho fenómeno natural no solo al alumnado si no también a la población local a través de un cartel que colgaremos en los alrededores y con el video que colgaremos en YouTube.</p>
<p><strong>Aprendizaje basado en Proyectos: </strong>partiendo de la necesidad de nuestro barrio, se ha creado este proyecto donde el alumnado se convierte en el protagonista generando este proyecto significativo.</p>
</div>
